<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Intelligent irrigation management for modern farmers" />
  <meta name="theme-color" content="#16a34a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="DroughtSmart" />
  <meta name="apple-mobile-web-app-icon" href="/icon-192.png" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" href="/favicon.ico" />
  <link rel="apple-touch-icon" href="/icon-192.png" />
  <title>Drought Smart System</title>
</head>
<body>
  <div id="root"></div>
  <script>
    /**
     * DO NOT REMOVE
     * Sends client-side errors to the chariot-logger defined in vite.config.ts
     */
    if ("%MODE%" === "development") {
      // Send to logger and notify parent
      const sendError = (error) => {
        if (!error?.message) return; // only log errors with a message

        fetch("/@chariot-logger", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(error),
        }).catch(() => { });
        window.parent.postMessage("error", "*");
      };

      // Catch all errors
      window.addEventListener("error", (e) => sendError(e), true);
      window.addEventListener(
        "unhandledrejection",
        (e) => sendError(e),
        true
      );

      // Catch console.error
      const originalError = console.error;
      console.error = function (...args) {
        originalError.apply(console, args);
        sendError({ type: "console", args });
      };
    }
  </script>
  <script>
    // Register Service Worker
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/service-worker.js').catch(() => {
          // Service worker registration failed, app will still work
        });
      });
    }
  </script>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
